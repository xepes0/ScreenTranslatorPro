name: ScreenTranslatorPro
options:
  bundleIdPrefix: com.xepes
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  ScreenTranslatorPro:
    type: application
    platform: iOS
    sources:
      - path: ScreenTranslatorPro/MVP
    preBuildScripts:
      - name: Generate selected app icon assets
        script: |
          set -e
          ICON_SOURCE="$SRCROOT/Assets/SelectedAppIcon.jpg"
          APPICON_DIR="$SRCROOT/ScreenTranslatorPro/MVP/Assets.xcassets/AppIcon.appiconset"
          LOGO_DIR="$SRCROOT/ScreenTranslatorPro/MVP/Assets.xcassets/AppLogo.imageset"

          test -f "$ICON_SOURCE"
          mkdir -p "$APPICON_DIR" "$LOGO_DIR"

          /usr/bin/sips -z 1024 1024 -s format png "$ICON_SOURCE" --out "$APPICON_DIR/AppIcon.png" >/dev/null
          /usr/bin/sips -z 128 128 -s format png "$ICON_SOURCE" --out "$LOGO_DIR/AppLogo.png" >/dev/null
          /usr/bin/sips -z 256 256 -s format png "$ICON_SOURCE" --out "$LOGO_DIR/AppLogo@2x.png" >/dev/null
          /usr/bin/sips -z 384 384 -s format png "$ICON_SOURCE" --out "$LOGO_DIR/AppLogo@3x.png" >/dev/null
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xepes.ScreenTranslatorPro
        PRODUCT_NAME: ScreenTranslatorPro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 屏幕翻译
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
