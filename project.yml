name: ScreenTranslatorPro
options:
  bundleIdPrefix: com.xepes
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  ScreenTranslatorPro:
    type: application
    platform: iOS
    sources:
      - path: ScreenTranslatorPro/MVP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xepes.ScreenTranslatorPro
        PRODUCT_NAME: ScreenTranslatorPro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Screen Translator Pro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
